name: Landing (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "landing/**"
      - "lib/release-assets.js"
      - ".github/workflows/landing-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Sync shared release-assets into landing
        run: node scripts/sync-release-assets.js

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: landing

      - id: deployment
        uses: actions/deploy-pages@v4
