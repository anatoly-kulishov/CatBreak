name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.6, must match package.json)"
        required: true
        type: string
      ref:
        description: "Branch or commit to tag (default main)"
        required: false
        default: main
        type: string
      rebuild_only:
        description: "Rebuild artifacts for an existing tag (do not create a new tag)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.rebuild_only && format('v{0}', inputs.version) || github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: >-
    ${{ github.event_name == 'push' && github.ref_name
        || format('v{0}', inputs.version) }}

jobs:
  tag:
    if: github.event_name == 'workflow_dispatch' && !inputs.rebuild_only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Verify version
        run: |
          INPUT_VERSION="${{ inputs.version }}"
          INPUT_VERSION="${INPUT_VERSION#v}"
          node scripts/version.js check --release --tag="v$INPUT_VERSION"
          echo "TAG=v$INPUT_VERSION" >> "$GITHUB_ENV"

      - name: Create and push tag
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            EXISTING=$(git rev-parse "$TAG")
            HEAD_SHA=$(git rev-parse HEAD)
            echo "Tag $TAG already exists at $EXISTING (HEAD is $HEAD_SHA)."
            if [ "$EXISTING" = "$HEAD_SHA" ]; then
              echo "::notice::Tag points to this commit. Run workflow again with rebuild_only=true to upload artifacts."
            else
              echo "::error::Tag $TAG points to a different commit. Delete the tag on GitHub or pick another version."
            fi
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

  release-notes:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.rebuild_only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          fetch-tags: true

      - name: Verify version matches tag
        run: node scripts/version.js check --tag="$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}

      - name: Write release notes from CHANGELOG
        run: node scripts/release-notes-from-changelog.js "$RELEASE_TAG" > release-notes.md
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" --title "Cat Break ${RELEASE_TAG#v}" --notes-file release-notes.md
          fi

  build:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.rebuild_only)
    needs: release-notes
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac
          - os: windows-latest
            args: --win
          - os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: >-
            ${{ github.event_name == 'workflow_dispatch' && inputs.rebuild_only
                && inputs.ref || env.RELEASE_TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci
      - run: npm run prepare

      - name: Guard against stale workflow re-run
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          if (-not (Test-Path scripts/upload-windows-release.ps1)) {
            Write-Error @"
          This job is using an old checkout (missing upload-windows-release.ps1).
          Do NOT use Re-run failed jobs on an old Release run.
          Use either:
            - Actions > Release > Run workflow (rebuild_only=true, version as in the tag), or
            - Actions > Release Windows assets > Run workflow
          "@
          }
          $ref = git rev-parse --short HEAD
          Write-Host "Building Windows from commit $ref"

      - name: Build Windows installers
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win --publish never

      - name: Upload Windows release assets
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./scripts/upload-windows-release.ps1 -Tag $env:RELEASE_TAG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}

      - name: Build and publish to GitHub Releases
        if: matrix.os != 'windows-latest'
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 75
          max_attempts: 3
          retry_wait_seconds: 45
          command: npx electron-builder ${{ matrix.args }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REF: refs/tags/${{ env.RELEASE_TAG }}
          GITHUB_REF_NAME: ${{ env.RELEASE_TAG }}

      - name: Upload macOS install notes
        if: matrix.os == 'macos-latest'
        run: gh release upload "$RELEASE_TAG" docs/en/MACOS_INSTALL.md --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
