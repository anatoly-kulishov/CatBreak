<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self'; media-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <title>Break</title>
    <link rel="stylesheet" href="break.css" />
  </head>
  <body>
    <div id="bg" class="bg" aria-hidden="true"></div>
    <div class="shade" aria-hidden="true"></div>

    <div id="cat-stage" class="cat-stage">
      <div id="countdown" class="countdown" aria-live="polite" aria-atomic="true">
        <span id="countdown-clock">0:00</span>
        <svg class="countdown__paw" viewBox="0 0 24 24" aria-hidden="true">
          <ellipse cx="12" cy="14.5" rx="5" ry="6" fill="#6ee7ff" />
          <circle cx="7" cy="8.5" r="2.1" fill="#6ee7ff" />
          <circle cx="12" cy="6.5" r="2.1" fill="#6ee7ff" />
          <circle cx="17" cy="8.5" r="2.1" fill="#6ee7ff" />
          <circle cx="9" cy="4.8" r="1.7" fill="#6ee7ff" />
          <circle cx="15" cy="4.8" r="1.7" fill="#6ee7ff" />
        </svg>
      </div>
      <video
        id="neko1"
        class="cat-video"
        src="../assets/neko1.webm"
        autoplay
        muted
        playsinline
      ></video>
      <video
        id="neko2"
        class="cat-video cat-sleep"
        src="../assets/neko2.webm"
        muted
        playsinline
        loop
        hidden
      ></video>
    </div>

    <div class="paw-layer" aria-hidden="true">
      <svg class="paw-decor paw-decor--1" viewBox="0 0 24 24" aria-hidden="true">
        <ellipse cx="12" cy="14.5" rx="5" ry="6" fill="#6ee7ff" />
        <circle cx="7" cy="8.5" r="2.1" fill="#6ee7ff" />
        <circle cx="12" cy="6.5" r="2.1" fill="#6ee7ff" />
        <circle cx="17" cy="8.5" r="2.1" fill="#6ee7ff" />
        <circle cx="9" cy="4.8" r="1.7" fill="#6ee7ff" />
        <circle cx="15" cy="4.8" r="1.7" fill="#6ee7ff" />
      </svg>
      <svg class="paw-decor paw-decor--2" viewBox="0 0 24 24" aria-hidden="true">
        <ellipse cx="12" cy="14.5" rx="5" ry="6" fill="#6ee7ff" />
        <circle cx="7" cy="8.5" r="2.1" fill="#6ee7ff" />
        <circle cx="12" cy="6.5" r="2.1" fill="#6ee7ff" />
        <circle cx="17" cy="8.5" r="2.1" fill="#6ee7ff" />
        <circle cx="9" cy="4.8" r="1.7" fill="#6ee7ff" />
        <circle cx="15" cy="4.8" r="1.7" fill="#6ee7ff" />
      </svg>
      <svg class="paw-decor paw-decor--3" viewBox="0 0 24 24" aria-hidden="true">
        <ellipse cx="12" cy="14.5" rx="5" ry="6" fill="#6ee7ff" />
        <circle cx="7" cy="8.5" r="2.1" fill="#6ee7ff" />
        <circle cx="12" cy="6.5" r="2.1" fill="#6ee7ff" />
        <circle cx="17" cy="8.5" r="2.1" fill="#6ee7ff" />
        <circle cx="9" cy="4.8" r="1.7" fill="#6ee7ff" />
        <circle cx="15" cy="4.8" r="1.7" fill="#6ee7ff" />
      </svg>
      <svg class="paw-decor paw-decor--4" viewBox="0 0 24 24" aria-hidden="true">
        <ellipse cx="12" cy="14.5" rx="5" ry="6" fill="#6ee7ff" />
        <circle cx="7" cy="8.5" r="2.1" fill="#6ee7ff" />
        <circle cx="12" cy="6.5" r="2.1" fill="#6ee7ff" />
        <circle cx="17" cy="8.5" r="2.1" fill="#6ee7ff" />
        <circle cx="9" cy="4.8" r="1.7" fill="#6ee7ff" />
        <circle cx="15" cy="4.8" r="1.7" fill="#6ee7ff" />
      </svg>
    </div>

    <audio id="meow-sound" src="../assets/meow.mp3" preload="auto"></audio>

    <aside id="side" class="side">
      <div class="side-card">
        <header class="side-card__head">
          <div class="side-card__mascot" aria-hidden="true">
            <img
              class="side-card__cat"
              src="../assets/app-icon-1024.png"
              width="54"
              height="54"
              alt=""
              decoding="async"
              onerror="this.onerror=null;this.src='../assets/trayIcon.png';"
            />
            <svg class="side-card__paw-badge" viewBox="0 0 24 24" aria-hidden="true">
              <ellipse cx="12" cy="14.5" rx="4" ry="5" fill="#6ee7ff" />
              <circle cx="8" cy="9" r="1.6" fill="#6ee7ff" />
              <circle cx="12" cy="7" r="1.6" fill="#6ee7ff" />
              <circle cx="16" cy="9" r="1.6" fill="#6ee7ff" />
            </svg>
          </div>
          <div class="side-card__intro">
            <p id="eyebrow" class="eyebrow"></p>
            <p id="hint" class="hint"></p>
          </div>
        </header>
        <section id="exercises" class="exercises" hidden>
          <h2 id="exercises-title"></h2>
          <ul>
            <li id="exercise-1"></li>
            <li id="exercise-2"></li>
            <li id="exercise-3"></li>
            <li id="exercise-4"></li>
          </ul>
        </section>
        <button id="skip" type="button" class="skip" hidden>
          <svg class="skip__paw-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <ellipse cx="12" cy="14.5" rx="4.5" ry="5.5" fill="currentColor" opacity="0.85" />
            <circle cx="7.5" cy="8.5" r="1.8" fill="currentColor" opacity="0.85" />
            <circle cx="12" cy="6.5" r="1.8" fill="currentColor" opacity="0.85" />
            <circle cx="16.5" cy="8.5" r="1.8" fill="currentColor" opacity="0.85" />
          </svg>
          <span class="skip__label"></span>
        </button>
      </div>
    </aside>

    <script src="break.js"></script>
  </body>
</html>
