<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; media-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <title>Break</title>
    <link rel="stylesheet" href="break.css" />
  </head>
  <body>
    <div id="bg" class="bg" aria-hidden="true"></div>
    <div class="shade" aria-hidden="true"></div>

    <div id="cat-stage" class="cat-stage">
      <div id="countdown" class="countdown">0:00</div>
      <video
        id="neko1"
        class="cat-video"
        src="../assets/neko1.webm"
        autoplay
        muted
        playsinline
      ></video>
      <video
        id="neko2"
        class="cat-video cat-sleep"
        src="../assets/neko2.webm"
        muted
        playsinline
        loop
        hidden
      ></video>
    </div>

    <audio id="meow-sound" src="../assets/meow.mp3" preload="auto"></audio>

    <aside id="side" class="side">
      <p id="hint" class="hint"></p>
      <section id="exercises" class="exercises" hidden>
        <h2 id="exercises-title"></h2>
        <ul>
          <li id="exercise-1"></li>
          <li id="exercise-2"></li>
          <li id="exercise-3"></li>
          <li id="exercise-4"></li>
        </ul>
      </section>
      <button id="skip" type="button" class="skip" hidden></button>
    </aside>

    <script src="break.js"></script>
  </body>
</html>
