<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="dark" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <title>Settings</title>
    <link rel="stylesheet" href="settings.css" />
  </head>
  <body>
    <div id="update-banner" class="update-banner" hidden>
      <p id="update-banner-title" class="update-banner__title"></p>
      <p id="update-banner-hint" class="update-banner__hint"></p>
      <p id="update-banner-asset" class="update-banner__asset" hidden></p>
      <div id="update-progress-wrap" class="update-banner__progress" hidden>
        <div class="update-banner__progress-track">
          <div id="update-progress-bar" class="update-banner__progress-bar"></div>
        </div>
        <span id="update-progress-label" class="update-banner__progress-label"></span>
      </div>
      <div class="update-banner__actions">
        <button type="button" id="update-download" class="update-banner__primary"></button>
        <button type="button" id="update-later" class="button-secondary" data-i18n="settings.updateLater"></button>
      </div>
    </div>

    <header class="settings-header">
      <h1>Cat Break</h1>
      <p class="sub" data-i18n="settings.sub"></p>
    </header>

    <section class="settings-section" aria-labelledby="sec-general">
      <h2 id="sec-general" class="settings-section__title" data-i18n="settings.sectionGeneral"></h2>
      <label class="row">
        <input id="checkForUpdates" type="checkbox" />
        <span data-i18n="settings.checkForUpdates"></span>
      </label>
      <label class="field">
        <span class="field__label" data-i18n="settings.language"></span>
        <select id="locale">
          <option value="auto" data-i18n="settings.localeAuto"></option>
          <option value="ru" data-i18n="settings.localeRu"></option>
          <option value="en" data-i18n="settings.localeEn"></option>
        </select>
      </label>
    </section>

    <section class="settings-section" aria-labelledby="sec-timing">
      <h2 id="sec-timing" class="settings-section__title" data-i18n="settings.sectionTiming"></h2>
      <div class="preset-grid">
        <button type="button" class="preset-button" data-preset-work="55" data-preset-break="5">
          <span data-i18n="settings.presetLong"></span>
        </button>
        <button type="button" class="preset-button" data-preset-work="50" data-preset-break="10">
          <span data-i18n="settings.presetBalanced"></span>
        </button>
        <button type="button" class="preset-button" data-preset-work="25" data-preset-break="5">
          <span data-i18n="settings.presetPomodoro"></span>
        </button>
      </div>
      <p class="field-hint field-hint--preset" data-i18n="settings.quickStartHint"></p>
      <label class="field">
        <span class="field__label" data-i18n="settings.workMinutes"></span>
        <input id="workMinutes" type="number" min="1" max="480" />
      </label>
      <label class="field">
        <span class="field__label" data-i18n="settings.breakMinutes"></span>
        <input id="breakMinutes" type="number" min="1" max="60" />
      </label>
      <label class="field">
        <span class="field__label" data-i18n="settings.idlePauseMinutes"></span>
        <input id="idlePauseMinutes" type="number" min="1" max="30" />
      </label>
      <p class="field-hint" data-i18n="settings.idlePauseHint"></p>
    </section>

    <section class="settings-section" aria-labelledby="sec-behavior">
      <h2 id="sec-behavior" class="settings-section__title" data-i18n="settings.sectionBehavior"></h2>
      <label class="row">
        <input id="notifyBeforeBreak" type="checkbox" />
        <span data-i18n="settings.notifyBeforeBreak"></span>
      </label>
      <label class="row">
        <input id="soundOnBreakEnd" type="checkbox" />
        <span data-i18n="settings.soundOnBreakEnd"></span>
      </label>
      <label class="row">
        <input id="showExercises" type="checkbox" />
        <span data-i18n="settings.showExercises"></span>
      </label>
      <label class="row">
        <input id="strictBreak" type="checkbox" />
        <span data-i18n="settings.strictBreak"></span>
      </label>
      <p class="field-hint field-hint--tight" data-i18n="settings.strictBreakHint"></p>
      <label id="launchAtLoginRow" class="row row--spaced" hidden>
        <input id="launchAtLogin" type="checkbox" />
        <span>
          <span data-i18n="settings.launchAtLogin"></span>
          <small class="note" data-i18n="settings.launchAtLoginNote"></small>
        </span>
      </label>
    </section>

    <div class="actions">
      <button id="save" type="button" data-i18n="settings.save"></button>
      <button id="demoBreak" class="button-secondary" type="button" data-i18n="settings.demoBreak"></button>
    </div>

    <p id="status" class="status" role="status"></p>

    <footer class="meta">
      <span id="app-version"></span>
      ·
      <a id="releases-link" href="#" target="_blank" rel="noopener noreferrer"></a>
    </footer>

    <script src="settings.js"></script>
  </body>
</html>
